name: Shorten menu change frequency

on:
  push:
    paths:
      - '.github/workflows/shorten-menu-frequency.yml'

permissions:
  contents: write

jobs:
  update-frequency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shorten indecision intervals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('what-to-eat/index.html')
          text = path.read_text(encoding='utf-8')
          old = """  function intervalRange(value=Number(els.slider.value)){
    if(value<=20) return [16,24];
    if(value<=40) return [10,16];
    if(value<=60) return [6,10];
    if(value<=80) return [3.5,6];
    return [1.5,3.5];
  }"""
          new = """  function intervalRange(value=Number(els.slider.value)){
    if(value<=20) return [10,16];
    if(value<=40) return [6,10];
    if(value<=60) return [3.5,6];
    if(value<=80) return [2.2,4];
    return [1.2,2.5];
  }"""
          if old not in text:
              raise SystemExit('Expected intervalRange block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add what-to-eat/index.html
          git commit -m "Shorten menu indecision intervals"
          git push
