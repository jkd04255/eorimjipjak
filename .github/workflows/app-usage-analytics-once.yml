name: One-time app usage analytics migration

on:
  push:
    paths:
      - '.github/workflows/app-usage-analytics-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add usage tracking and dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          BUILD = '20260911-usage-time-1'
          root = Path('.')

          analytics_js = r'''(() => {
            'use strict';

            const NAMESPACE = 'eorimjipjak-jkd04255';
            const BASE = 'https://counterapi.com';
            const PRODUCTION_HOST = 'jkd04255.github.io';
            const REPO_PREFIX = '/eorimjipjak';
            const USAGE_TICK_SECONDS = 5;
            const USAGE_TICK_MS = USAGE_TICK_SECONDS * 1000;
            const APP_KEYS = new Set([
              'calculator', 'spell-checker', 'kkamppak', 'survival', 'siren',
              'what-to-eat', 'nunchi-timer', 'gugu-mackerel', 'broken-clock',
              'solar-charge', 'clock-out', 'seolleong-seolleong', 'changbak',
              'frequency', 'excuse', 'memory-test', 'fishing'
            ]);

            if (location.hostname !== PRODUCTION_HOST) return;

            function keyFromPath(pathname) {
              let path = pathname || '/';
              if (path.startsWith(REPO_PREFIX)) path = path.slice(REPO_PREFIX.length);
              path = path.replace(/^\/+|\/+$/g, '');
              if (!path) return 'home';

              const first = path.split('/')[0] || 'home';
              return first.toLowerCase().replace(/[^a-z0-9_-]/g, '-').slice(0, 80) || 'other';
            }

            function track(action, key) {
              const url = new URL(`${BASE}/pixel.gif`);
              url.searchParams.set('ns', NAMESPACE);
              url.searchParams.set('action', action);
              url.searchParams.set('key', key);
              url.searchParams.set('_', `${Date.now()}-${Math.random().toString(36).slice(2)}`);

              try {
                fetch(url.toString(), {
                  method: 'GET',
                  mode: 'no-cors',
                  cache: 'no-store',
                  keepalive: true,
                  credentials: 'omit',
                  referrerPolicy: 'no-referrer'
                }).catch(() => {});
              } catch (_) {
                const img = new Image(1, 1);
                img.referrerPolicy = 'no-referrer';
                img.src = url.toString();
              }
            }

            // 앱 페이지에서만 세션과 활성 이용시간을 기록합니다.
            // 화면이 보이는 동안 5초마다 usage5 이벤트 1회를 쌓습니다.
            function setupUsageTracking(key) {
              if (!APP_KEYS.has(key)) return;

              track('usage-session', key);
              let timer = null;

              const stop = () => {
                if (timer !== null) {
                  clearInterval(timer);
                  timer = null;
                }
              };

              const start = () => {
                if (timer !== null || document.hidden) return;
                timer = setInterval(() => {
                  if (!document.hidden) track('usage5', key);
                }, USAGE_TICK_MS);
              };

              document.addEventListener('visibilitychange', () => {
                if (document.hidden) stop();
                else start();
              });
              window.addEventListener('pagehide', stop);
              window.addEventListener('pageshow', start);
              start();
            }

            // 분석 페이지의 "누적 앱 실행" 값과 같은 기준을 사용합니다.
            async function readPopularity(key) {
              const params = new URLSearchParams({
                readOnly: 'true',
                _: Date.now().toString()
              });
              const url = `${BASE}/api/${encodeURIComponent(NAMESPACE)}/launch/${encodeURIComponent(key)}?${params}`;

              try {
                const response = await fetch(url, {
                  cache: 'no-store',
                  credentials: 'omit',
                  referrerPolicy: 'no-referrer'
                });
                if (response.status === 404) return 0;
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const value = typeof data.value === 'number'
                  ? data.value
                  : Number(String(data.value || '0').replace(/,/g, ''));
                return Number.isFinite(value) ? value : 0;
              } catch (_) {
                return null;
              }
            }

            function injectBadgeStyles() {
              if (document.getElementById('toolbox-live-badge-styles')) return;
              const style = document.createElement('style');
              style.id = 'toolbox-live-badge-styles';
              style.textContent = `
                .tool-top .status-cluster{margin-left:auto;display:flex;align-items:flex-start;justify-content:flex-end;gap:6px;flex-wrap:wrap;max-width:68%}
                .tool-top .status-cluster>.tag{margin:0}
                .live-badge{display:inline-flex;align-items:center;justify-content:center;min-height:23px;padding:4px 9px;border-radius:6px;font-size:10px;font-weight:900;line-height:1;letter-spacing:.25px;box-shadow:0 2px 0 rgba(34,35,44,.12);white-space:nowrap}
                .live-badge.popular{background:#ef4444;color:#fff;transform:rotate(-2deg)}
                .live-badge.new{background:#ffd84d;color:#4d3b00;transform:rotate(2deg)}
                @media(max-width:720px){.tool-top .status-cluster{max-width:72%;gap:5px}.live-badge{padding:4px 8px;font-size:9px}}
              `;
              document.head.appendChild(style);
            }

            function prepareClusters(cards) {
              injectBadgeStyles();
              cards.forEach((card) => {
                const top = card.querySelector('.tool-top');
                if (!top) return;

                let cluster = top.querySelector('.status-cluster');
                if (cluster) return;

                const tag = top.querySelector('.tag');
                if (!tag) return;

                cluster = document.createElement('div');
                cluster.className = 'status-cluster';
                top.insertBefore(cluster, tag);
                cluster.appendChild(tag);
              });
            }

            function clearLiveBadges(cards) {
              cards.forEach((card) => {
                card.querySelectorAll('.live-badge').forEach((badge) => badge.remove());
              });
            }

            function addBadge(card, type, text) {
              const cluster = card.querySelector('.status-cluster');
              if (!cluster) return;
              const badge = document.createElement('span');
              badge.className = `live-badge ${type}`;
              badge.textContent = text;
              badge.setAttribute('aria-label', text);
              cluster.appendChild(badge);
            }

            async function refreshHomeRanking(state) {
              const { grid, cards, newestCard, comingCard } = state;
              if (!grid || cards.length === 0) return;

              const scores = await Promise.all(cards.map(async (card) => {
                const key = keyFromPath(new URL(card.href, location.href).pathname);
                const score = await readPopularity(key);
                return {
                  card,
                  key,
                  score,
                  originalIndex: Number(card.dataset.originalIndex || 0)
                };
              }));

              if (scores.every((item) => item.score === null)) return;

              const normalized = scores.map((item) => ({
                ...item,
                score: item.score === null ? 0 : item.score
              }));

              const popularityOrder = [...normalized].sort((a, b) =>
                b.score - a.score || a.originalIndex - b.originalIndex
              );

              const popularTop2 = popularityOrder
                .filter((item) => item.score > 0)
                .slice(0, 2)
                .map((item) => item.card);

              const newestEntry = popularityOrder.find((item) => item.card === newestCard) || null;
              const finalOrder = popularityOrder.filter((item) => item.card !== newestCard);
              if (newestEntry) finalOrder.splice(Math.min(2, finalOrder.length), 0, newestEntry);

              const fragment = document.createDocumentFragment();
              finalOrder.forEach((item) => fragment.appendChild(item.card));
              if (comingCard) fragment.appendChild(comingCard);
              grid.appendChild(fragment);

              clearLiveBadges(cards);
              popularTop2.forEach((card) => addBadge(card, 'popular', '인기'));
              if (newestCard) addBadge(newestCard, 'new', 'NEW');
            }

            function setupHomeRanking() {
              const grid = document.querySelector('main.grid');
              if (!grid) return;

              const cards = Array.from(grid.children).filter((el) =>
                el.matches && el.matches('a.tool-card[href]')
              );
              const comingCard = Array.from(grid.children).find((el) =>
                el.matches && el.matches('.tool-card.coming')
              ) || null;
              if (cards.length === 0) return;

              cards.forEach((card, index) => {
                card.dataset.originalIndex = String(index);
              });

              const newestCard = cards[cards.length - 1] || null;
              prepareClusters(cards);

              const state = { grid, cards, newestCard, comingCard };
              refreshHomeRanking(state);

              setInterval(() => {
                if (!document.hidden) refreshHomeRanking(state);
              }, 60000);
            }

            const pageKey = keyFromPath(location.pathname);
            track('pageview', pageKey);
            setupUsageTracking(pageKey);

            document.addEventListener('click', (event) => {
              const card = event.target.closest && event.target.closest('a.tool-card[href]');
              if (!card || card.classList.contains('coming')) return;

              try {
                const target = new URL(card.href, location.href);
                if (target.hostname !== location.hostname) return;
                const key = keyFromPath(target.pathname);
                track('launch', key);
                track('launch', 'any');
              } catch (_) {
                // 잘못된 링크 하나 때문에 페이지 동작이 깨지지 않도록 무시합니다.
              }
            }, { capture: true });

            setupHomeRanking();
          })();
          '''

          dashboard_html = r'''<!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#f0f0f4">
            <title>방문자 분석 — 개똥도 쓸모는 있겠지</title>
            <style>
              :root{color-scheme:light;--bg:#f0f0f4;--paper:#fff;--ink:#22232c;--muted:#6f7080;--line:#dcdce4;--purple:#6045db;--lime:#dfff86;--dark:#292a34;--soft:#e9e7f1}
              *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all}button,a{font:inherit}a{color:inherit;text-decoration:none}
              .shell{width:min(1040px,calc(100% - 32px));margin:0 auto;padding-bottom:54px}header{min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}
              .brand{display:flex;align-items:center;gap:13px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--ink);color:#fff;font-size:20px;font-weight:900;transform:rotate(-6deg)}h1{margin:0;font-size:21px;letter-spacing:-.8px}.sub{margin:2px 0 0;color:var(--muted);font-size:12px}.home{padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:700}.home:hover{border-color:#bcb4e6;color:var(--purple)}
              .hero{padding:48px 0 27px}.eyebrow{margin:0 0 8px;color:var(--purple);font-size:11px;font-weight:900;letter-spacing:1.2px}.hero h2{margin:0;font-size:clamp(32px,6vw,58px);line-height:1.08;letter-spacing:-2.5px}.hero p{max-width:680px;margin:15px 0 0;color:var(--muted);font-size:14px}
              .status-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px;color:var(--muted);font-size:12px}.refresh{border:0;border-radius:10px;padding:9px 13px;background:var(--dark);color:#fff;font-size:12px;font-weight:800;cursor:pointer}.refresh:disabled{opacity:.55;cursor:wait}
              .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:30px}.metric{min-height:138px;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 16px 38px -34px #22232c88}.metric .label{color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:12px;font-size:34px;line-height:1;font-weight:850;letter-spacing:-1.5px}.metric small{display:block;margin-top:12px;color:#8b8c98;font-size:11px}.metric.highlight{background:var(--lime);border-color:#c9e967}.metric.highlight .label,.metric.highlight small{color:#536324}
              .panel{margin-top:18px;padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--paper)}.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.panel h3{margin:0;font-size:22px;letter-spacing:-.8px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.summary-chip{padding:6px 10px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:800;color:#5e5870;white-space:nowrap}
              .rank,.usage-rank{display:grid;gap:10px}.rank-row{display:grid;grid-template-columns:minmax(130px,1.4fr) minmax(160px,3fr) 72px 72px;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eeeef2}.usage-row{display:grid;grid-template-columns:minmax(130px,1.35fr) minmax(150px,2.5fr) 110px 100px 72px;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eeeef2}.rank-row:last-child,.usage-row:last-child{border-bottom:0}.app-name{font-weight:800}.slug{display:block;color:#92939e;font-size:10px;font-weight:500}.bar-track{height:10px;border-radius:99px;background:#efeff4;overflow:hidden}.bar{height:100%;min-width:2px;border-radius:99px;background:var(--purple);transition:width .35s ease}.usage-bar{background:#8566f1}.number{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}.number b{display:block;font-size:15px}.number span{color:var(--muted);font-size:10px}
              .note{margin-top:22px;padding:17px 18px;border:1px dashed #c8c3db;border-radius:14px;background:var(--soft);color:#625e6c;font-size:12px}.note strong{color:var(--ink)}.error{display:none;margin:16px 0;padding:14px 16px;border-radius:12px;background:#fff0f0;color:#932f2f;font-size:12px}.error.show{display:block}footer{display:flex;justify-content:space-between;gap:20px;margin-top:32px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
              @media(max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.rank-row{grid-template-columns:minmax(110px,1.4fr) minmax(120px,2.2fr) 64px 64px}.usage-row{grid-template-columns:minmax(110px,1.3fr) minmax(110px,2fr) 92px 86px}.usage-row .sessions{display:none}}
              @media(max-width:560px){.shell{width:min(460px,calc(100% - 24px))}header{min-height:80px}.sub{display:none}.hero{padding:36px 0 22px}.cards{gap:10px}.metric{min-height:124px;padding:16px}.metric strong{font-size:29px}.panel{padding:18px}.panel-head{align-items:flex-start;flex-direction:column}.rank-row{grid-template-columns:minmax(105px,1.3fr) 1.7fr 55px}.rank-row .number.total{display:none}.usage-row{grid-template-columns:minmax(100px,1.2fr) 1.45fr 82px 72px;gap:9px}.usage-row .sessions{display:none}.slug{display:none}footer{display:block}footer span{display:block;margin-top:4px}}
            </style>
          </head>
          <body>
            <div class="shell">
              <header><div class="brand"><span class="mark">↗</span><div><h1>방문자 분석</h1><p class="sub">개똥도 쓸모는 있겠지 · 운영 통계</p></div></div><a class="home" href="../">← 홈으로</a></header>
              <section class="hero"><p class="eyebrow">TOOLBOX ANALYTICS</p><h2>사람들이 정말<br>들어오긴 하나?</h2><p>홈 방문, 앱 실행 횟수와 함께 이제 앱별 실제 이용시간도 확인합니다. 분석 페이지를 열어도 방문 수에는 포함되지 않습니다.</p></section>
              <div class="status-row"><span id="updated">통계를 불러오는 중…</span><button class="refresh" id="refresh" type="button">새로고침</button></div>
              <div class="error" id="error"></div>

              <section class="cards" aria-label="주요 방문 통계">
                <article class="metric highlight"><span class="label">최근 24시간 순방문자</span><strong id="unique24">—</strong><small>같은 방문자는 중복을 줄여 집계</small></article>
                <article class="metric"><span class="label">최근 24시간 홈 방문</span><strong id="views24">—</strong><small>홈이 열린 횟수</small></article>
                <article class="metric"><span class="label">최근 7일 홈 방문</span><strong id="views7d">—</strong><small>최근 7일 누적</small></article>
                <article class="metric"><span class="label">누적 홈 방문</span><strong id="viewsTotal">—</strong><small>분석 기능 설치 이후</small></article>
              </section>

              <section class="panel">
                <div class="panel-head"><div><h3>어떤 앱을 눌렀나</h3><p>홈 화면의 앱 카드를 눌러 실행한 횟수입니다.</p></div><span class="summary-chip" id="launchSummary">최근 7일 —회</span></div>
                <div class="rank" id="rank" aria-live="polite"></div>
                <div class="note"><strong>실행 횟수:</strong> 홈에서 앱 카드를 누른 횟수입니다. 앱 주소로 바로 들어온 방문은 이 실행 횟수에는 포함되지 않지만, 아래 이용시간 통계에는 포함됩니다.</div>
              </section>

              <section class="panel">
                <div class="panel-head"><div><h3>앱별 이용시간</h3><p>앱 화면이 실제로 보이는 동안 쌓인 활성 이용시간입니다.</p></div><span class="summary-chip" id="usageSummary">누적 — · 평균 —</span></div>
                <div class="usage-rank" id="usageRank" aria-live="polite"></div>
                <div class="note"><strong>집계 기준:</strong> 앱 화면이 보이는 동안 5초 단위로 기록합니다. 다른 탭으로 이동하거나 화면이 숨겨지면 이용시간 기록을 멈춥니다. <b>평균 이용시간 = 누적 활성 이용시간 ÷ 이용 세션 수</b>이며, 이 기능을 설치한 시점부터 새로 쌓입니다.</div>
              </section>

              <footer><span>개인 이름·이메일·앱에 입력한 내용은 수집하지 않습니다.</span><span>운영 통계 · 2026</span></footer>
            </div>

            <script>
              (() => {
                'use strict';
                const NS = 'eorimjipjak-jkd04255';
                const API = `https://counterapi.com/api/${NS}`;
                const TICK_SECONDS = 5;
                const apps = [
                  ['calculator','어림짐작'],['spell-checker','맞춤법 교정기'],['kkamppak','깜빡'],['survival','살아는 있겠지'],['siren','쉿'],['what-to-eat','음… 뭐 먹지?'],['nunchi-timer','눈치'],['gugu-mackerel','구구상회'],['broken-clock','째깍?'],['solar-charge','쨍'],['clock-out','퇴근'],['seolleong-seolleong','설렁설렁'],['changbak','보면알지'],['frequency','될지도'],['excuse','그럴싸'],['memory-test','기억나?'],['fishing','낚였네']
                ];
                const nf = new Intl.NumberFormat('ko-KR');
                const $ = (id) => document.getElementById(id);

                function toNumber(value){if(typeof value==='number')return value;if(typeof value==='string')return Number(value.replace(/,/g,''))||0;return 0}
                async function read(action,key,options={}){const params=new URLSearchParams({readOnly:'true'});Object.entries(options).forEach(([k,v])=>params.set(k,String(v)));params.set('_',Date.now().toString());const url=`${API}/${encodeURIComponent(action)}/${encodeURIComponent(key)}?${params}`;const response=await fetch(url,{cache:'no-store',credentials:'omit'});if(!response.ok){if(response.status===404)return 0;throw new Error(`통계 서버 응답 오류 (${response.status})`)}const data=await response.json();return toNumber(data.value)}
                function metric(id,value){$(id).textContent=nf.format(value)}
                function formatDuration(seconds){const s=Math.max(0,Math.round(seconds));if(s<60)return `${s}초`;if(s<3600){const m=Math.floor(s/60),r=s%60;return r?`${m}분 ${r}초`:`${m}분`}if(s<86400){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return m?`${h}시간 ${m}분`:`${h}시간`}const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600);return h?`${d}일 ${h}시간`:`${d}일`}

                function renderLaunch(rows){const root=$('rank');const sorted=[...rows].sort((a,b)=>b.launchTotal-a.launchTotal||b.launchWeek-a.launchWeek||a.name.localeCompare(b.name,'ko'));const max=Math.max(1,...sorted.map(r=>r.launchTotal));root.innerHTML='';sorted.forEach((row,index)=>{const el=document.createElement('div');el.className='rank-row';const width=Math.max(row.launchTotal>0?3:0,(row.launchTotal/max)*100);el.innerHTML=`<div class="app-name">${index+1}. ${row.name}<span class="slug">${row.key}</span></div><div class="bar-track" aria-hidden="true"><div class="bar" style="width:${width}%"></div></div><div class="number"><b>${nf.format(row.launchWeek)}</b><span>최근 7일</span></div><div class="number total"><b>${nf.format(row.launchTotal)}</b><span>누적</span></div>`;root.appendChild(el)})}

                function renderUsage(rows){const root=$('usageRank');const sorted=[...rows].sort((a,b)=>b.totalSeconds-a.totalSeconds||b.averageSeconds-a.averageSeconds||a.name.localeCompare(b.name,'ko'));const max=Math.max(1,...sorted.map(r=>r.totalSeconds));root.innerHTML='';sorted.forEach((row,index)=>{const el=document.createElement('div');el.className='usage-row';const width=Math.max(row.totalSeconds>0?3:0,(row.totalSeconds/max)*100);el.innerHTML=`<div class="app-name">${index+1}. ${row.name}<span class="slug">${row.key}</span></div><div class="bar-track" aria-hidden="true"><div class="bar usage-bar" style="width:${width}%"></div></div><div class="number"><b>${formatDuration(row.totalSeconds)}</b><span>누적 이용</span></div><div class="number"><b>${formatDuration(row.averageSeconds)}</b><span>평균 이용</span></div><div class="number sessions"><b>${nf.format(row.sessions)}</b><span>세션</span></div>`;root.appendChild(el)})}

                async function loadRows(){const rows=[];for(let i=0;i<apps.length;i+=4){const batch=apps.slice(i,i+4);const values=await Promise.all(batch.map(async([key,name])=>{const[launchTotal,launchWeek,ticks,sessions]=await Promise.all([read('launch',key),read('launch',key,{timeline:'7d'}),read('usage5',key),read('usage-session',key)]);const totalSeconds=ticks*TICK_SECONDS;return{key,name,launchTotal,launchWeek,totalSeconds,sessions,averageSeconds:sessions?totalSeconds/sessions:0}}));rows.push(...values)}return rows}

                async function load(){const button=$('refresh'),error=$('error');button.disabled=true;error.classList.remove('show');$('updated').textContent='통계를 불러오는 중…';try{const[unique24,views24,views7d,viewsTotal,launch7d,rows]=await Promise.all([read('pageview','home',{timeline:'24h',unique:'true'}),read('pageview','home',{timeline:'24h'}),read('pageview','home',{timeline:'7d'}),read('pageview','home'),read('launch','any',{timeline:'7d'}),loadRows()]);metric('unique24',unique24);metric('views24',views24);metric('views7d',views7d);metric('viewsTotal',viewsTotal);$('launchSummary').textContent=`최근 7일 ${nf.format(launch7d)}회`;renderLaunch(rows);renderUsage(rows);const totalSeconds=rows.reduce((sum,row)=>sum+row.totalSeconds,0);const totalSessions=rows.reduce((sum,row)=>sum+row.sessions,0);const overallAverage=totalSessions?totalSeconds/totalSessions:0;$('usageSummary').textContent=`누적 ${formatDuration(totalSeconds)} · 평균 ${formatDuration(overallAverage)}`;const now=new Date();$('updated').textContent=`마지막 갱신 ${now.toLocaleString('ko-KR',{hour12:false})}`}catch(err){error.textContent=`통계를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요. ${err&&err.message?`(${err.message})`:''}`;error.classList.add('show');$('updated').textContent='불러오기 실패';const empty=apps.map(([key,name])=>({key,name,launchTotal:0,launchWeek:0,totalSeconds:0,sessions:0,averageSeconds:0}));renderLaunch(empty);renderUsage(empty)}finally{button.disabled=false}}
                $('refresh').addEventListener('click',load);load();
              })();
            </script>
          </body>
          </html>
          '''

          Path('shared/analytics.js').write_text(analytics_js.strip() + '\n', encoding='utf-8')
          Path('analytics/index.html').write_text(dashboard_html.strip() + '\n', encoding='utf-8')

          tracked_pages = [
              'calculator/index.html', 'spell-checker/index.html', 'kkamppak/index.html',
              'survival/play.html', 'siren/index.html', 'what-to-eat/index.html',
              'nunchi-timer/index.html', 'gugu-mackerel/index.html', 'broken-clock/index.html',
              'solar-charge/index.html', 'clock-out/index.html', 'seolleong-seolleong/index.html',
              'changbak/index.html', 'frequency/index.html', 'excuse/index.html',
              'memory-test/index.html', 'fishing/index.html'
          ]
          canonical = f'<script defer src="../shared/analytics.js?v={BUILD}"></script>'
          pattern = re.compile(r'<script\b[^>]*src=["\']\.\./shared/analytics\.js(?:\?[^"\']*)?["\'][^>]*></script>', re.I)

          for rel in tracked_pages:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              if pattern.search(text):
                  text = pattern.sub(canonical, text)
              else:
                  text = text.replace('</head>', f'  {canonical}\n</head>', 1)
              path.write_text(text, encoding='utf-8')

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          if re.search(r'shared/analytics\.js(?:\?v=[^"\']*)?', text):
              text = re.sub(r'shared/analytics\.js(?:\?v=[^"\']*)?', f'shared/analytics.js?v={BUILD}', text, count=1)
          home.write_text(text, encoding='utf-8')
          PY

